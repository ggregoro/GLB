[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# Open text files in nano (yazi's default is ${EDITOR:-vi}, and vi isn't installed)
[opener]
edit = [
  { run = "nano %s", block = true, for = "unix" },
]
