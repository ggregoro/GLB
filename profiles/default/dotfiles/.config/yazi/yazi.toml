[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# Open text files in Fresh, not yazi's default ${EDITOR:-vi} - vi isn't
# installed, so an unset $EDITOR (e.g. yazi launched outside a shell)
# would otherwise open nothing.
[opener]
edit = [
  { run = "fresh %s", block = true, for = "unix" },
]
