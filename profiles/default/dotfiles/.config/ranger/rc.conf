# GLB: profiles/default ranger config
#
# Not a from-scratch config — just the options that override ranger's
# built-in defaults for Greg's setup. Anything not set here falls back
# to ranger's own defaults.

# Borders looked good out of the box on the CachyOS test VM (2026-08-05) —
# keep them explicit rather than relying on ranger's default.
set draw_borders true

# Git/VCS status: on the CachyOS test VM, an icon-based git status
# indicator did not render (a Nerd Font glyph gap, not root-caused — see
# CLAUDE.md). Ranger's *built-in* VCS status uses colored letters
# (M/S/etc.) instead of font glyphs, so it works regardless of font
# support. Use that rather than chasing an icon font/plugin for now.
set vcs_aware true
set vcs_backend_git enabled
set vcs_backend_hg disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled
