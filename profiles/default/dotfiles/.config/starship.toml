"$schema" = 'https://starship.rs/config-schema.json'

# Raised from Starship's own 30ms default - too tight for a large or
# cold-cache directory (measured ~305ms scanning a slow real-world
# directory on GWB, GLB's Windows sibling, before landing on this value).
scan_timeout = 1000

# zsh's prompt. zsh sets STARSHIP_CONFIG to this file explicitly in
# ~/.zshrc (before `starship init zsh`) rather than relying on this
# being the unset-default path - an earlier version of this design
# (tested on Omarchy, see CLAUDE.md) leaked a different shell's
# STARSHIP_CONFIG through the environment and silently overrode a
# shell's colors; every shell now sets its own explicitly instead.
# Identical layout to ~/.config/starship-bash.toml (green) and
# ~/.config/starship-fish.toml (blue) - only the accent hue differs
# (zsh is orange, new 2026-09-11), so the three shells are instantly
# distinguishable at a glance while sharing one prompt design. Based on
# the official "Tokyo Night" preset from starship.rs/presets, with one
# addition: $cmd_duration (the preset does not include it by default),
# styled to match $time. $directory text is solid black in all three
# (Greg's explicit call, 2026-09-11).

format = """
[░▒▓](#d2aea3)\
$os\
[](bg:#e8935c fg:#d2aea3)\
$directory\
[](fg:#e8935c bg:#604239)\
$git_branch\
$git_status\
[](fg:#604239 bg:#362721)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#362721 bg:#30221d)\
$cmd_duration\
$time\
[ ](fg:#30221d)\
\n$character"""

[directory]
style = "fg:#000000 bg:#e8935c"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#604239"
format = '[[ $symbol $branch ](fg:#e8935c bg:#604239)]($style)'

[git_status]
style = "bg:#604239"
format = '[[($all_status$ahead_behind )](fg:#e8935c bg:#604239)]($style)'

[nodejs]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#e8935c bg:#362721)]($style)'

[bun]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#e8935c bg:#362721)]($style)'

[rust]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#e8935c bg:#362721)]($style)'

[golang]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#e8935c bg:#362721)]($style)'

[php]
symbol = ""
style = "bg:#362721"
format = '[[ $symbol ($version) ](fg:#e8935c bg:#362721)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#30221d"
format = '[[  $time ](fg:#cba9a0 bg:#30221d)]($style)'

[cmd_duration]
min_time = 5000
style = "bg:#30221d"
format = '[[  $duration ](fg:#cba9a0 bg:#30221d)]($style)'

[os]
style = "bg:#d2aea3 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
