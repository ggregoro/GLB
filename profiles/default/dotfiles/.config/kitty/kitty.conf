# GLB — Kitty configuration
#
# Kitty is installed by the `default` profile (see packages.txt). This
# is an opinionated, deliberately small config: JetBrainsMono Nerd Font,
# a dark palette, a slightly see-through background and a selection
# highlight that is easy to see. Edit through the symlink for a one-off
# tweak, or use `glb restore --from-manifest` with your own copy for a
# durable change. Reference: https://sw.kovidgoyal.net/kitty/conf/

# --- font ---
# Sized for a HiDPI screen at fractional scaling; raise it (11 or 12)
# on a 1x display.
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
font_size        9.0

# --- window ---
window_padding_width    14
confirm_os_window_close 0

# --- keys ---
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can tell it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty's legacy encoding sends Alt+Shift+Enter the same as Alt+Enter;
# send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# --- cursor and bell ---
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor
enable_audio_bell     no

# --- tab bar ---
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# --- colors (Hackerboy: https://github.com/ggregoro/hackerboy) ---
foreground #ddf7ff
background #0B0C16

cursor            #ddf7ff
cursor_text_color #0B0C16

active_border_color   #82FB9C
active_tab_background #82FB9C

color0  #0B0C16
color1  #ff5f7a
color2  #4fe88f
color3  #f7d450
color4  #5c9dff
color5  #c77dff
color6  #7cf8f7
color7  #ddf7ff
color8  #2d3450
color9  #ff8a9d
color10 #9cf7c2
color11 #ffe88a
color12 #8fbcff
color13 #dba6ff
color14 #d1fffe
color15 #ddf7ff

# On Omarchy, let the active theme's colors replace the palette above,
# so Kitty keeps following theme changes. Everywhere else the file does
# not exist and Kitty ignores the line.
include ~/.local/state/omarchy/current/theme/kitty.conf

# --- overrides (after the include, so they hold under any theme) ---
# Selected text: the palette's own selection color is too close to the
# background to see.
selection_background #3b4874
selection_foreground #ffffff

# Slightly see-through background; text stays solid.
background_opacity 0.90
